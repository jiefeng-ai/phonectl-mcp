[project]
name = "phonectl-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents see and drive a real iPhone over USB: screenshots, on-screen text, taps, swipes, typing, apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jiefeng-ai" }]
requires-python = ">=3.13"
keywords = ["mcp", "iphone", "ios", "automation", "agent", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "pillow>=13.0.0",
    "pymobiledevice3==11.50.0",
    "pyobjc-framework-vision>=13.0",
]

[project.urls]
Homepage = "https://github.com/jiefeng-ai/phonectl-mcp"
Issues = "https://github.com/jiefeng-ai/phonectl-mcp/issues"

[project.scripts]
phonectl-mcp = "phonectl.server:main"
phonectl = "phonectl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonectl"]
